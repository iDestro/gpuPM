[project]
name = "gpupm"
version = "0.1.0"
description = "GPU task and Linux account administration"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "argon2-cffi>=23,<26", "psutil>=6,<8", "nvidia-ml-py>=12,<14", "httpx>=0.27,<1"]

[project.scripts]
gpupm = "gpupm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpupm"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["linux: requires Linux procfs", "destructive: only run against explicitly created test resources"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
